[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - A simple, general-purpose collective intelligence engine for prediction"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # Core framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    # LLM integrations
    "openai>=1.0.0",
    "langchain-core>=0.1.30",
    "langchain-openai>=0.1.0",
    "langchain-google-vertexai>=1.0.1",
    "langchain-community>=0.0.28",
    # Vertex AI Gemini OpenAI-compat endpoint (ADC)
    "google-auth>=2.29.0",
    # Graph memory (Neo4j + Graphiti default)
    "graphiti-core[google-genai]>=0.29.0",
    "neo4j>=5.26,<6",
    # Local HuggingFace embeddings
    "langchain-huggingface[full]==1.2.2",
    # OASIS social media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # File processing
    "PyMuPDF>=1.24.0",
    # Encoding detection for non-UTF-8 text files
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langsmith>=0.8.3",
    "google-genai>=1.0.0",
    # Production database & ORM
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "gunicorn>=21.2.0",
    # Auth
    "authlib>=1.3.0",
    # Redis support for caching
    "redis>=5.0.1",
    # Background and Durable task execution
    "inngest>=0.5.18",
    # Cloud Storage
    "google-cloud-storage>=2.16.0",
]

[project.optional-dependencies]
zep = [
    "zep-cloud==3.13.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
override-dependencies = [
    "neo4j>=5.26,<6",
    "sentence-transformers>=5.2.0",
]
